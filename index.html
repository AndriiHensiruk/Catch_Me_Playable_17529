<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Catch_Me_Playable_17529_CSERIAL</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
body{display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}
#game{position:relative;width:100vw;height:100vh;max-width:calc(100vh * 9 / 16);max-height:calc(100vw * 16 / 9);overflow:hidden;background:#000;isolation:isolate}

/* ---------- Background (two layers, crossfade) ---------- */
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0;transform:scale(1.06);transition:opacity .55s ease,transform 1s cubic-bezier(.2,.8,.2,1);will-change:opacity,transform}
.bg.front{z-index:2}
.bg.on{opacity:1;transform:scale(1.015)}
.vignette{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.12) 75%,rgba(0,0,0,.28))}
.sweep{position:absolute;inset:0;z-index:90;opacity:0;pointer-events:none;background:linear-gradient(105deg,transparent 25%,rgba(255,255,255,.22) 48%,transparent 70%);transform:translateX(-130%)}
.sweep.run{animation:sweep .7s ease-out}
@keyframes sweep{0%{opacity:0;transform:translateX(-130%)}15%{opacity:1}100%{opacity:0;transform:translateX(130%)}}

/* ---------- Start screen ---------- */
.ui{position:absolute;inset:0;z-index:20;pointer-events:auto;transition:opacity .35s,transform .4s}
.ui.out{opacity:0;transform:scale(1.025);pointer-events:none}
.asset{position:absolute;display:block;width:auto;height:auto;pointer-events:none}
.title{width:84%;left:50%;top:49%;transform:translate(-50%,-50%);animation:titleFloat 3.8s ease-in-out infinite;filter:drop-shadow(0 5px 12px rgba(0,0,0,.16))}
@keyframes titleFloat{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-50%) translateY(-5px)}}
.startHint{width:82%;left:50%;top:69%;transform:translate(-50%,-50%);animation:hintBreath 2.6s ease-in-out infinite}
@keyframes hintBreath{0%,100%{opacity:.93}50%{opacity:1;transform:translate(-50%,-50%) scale(1.012)}}
.counter{width:25%;left:50%;top:78.5%;transform:translate(-50%,-50%)}
#counter{top:7%}
.counter.bump{animation:bump .5s ease-out}
@keyframes bump{
 0%{transform:translate(-50%,-50%) scale(1);filter:none}
 35%{transform:translate(-50%,-50%) scale(1.3);filter:drop-shadow(0 0 14px rgba(255,90,150,.95)) brightness(1.2)}
 70%{transform:translate(-50%,-50%) scale(.95)}
 100%{transform:translate(-50%,-50%) scale(1);filter:none}}
.startBtn,.cta{width:80%;left:50%;transform:translate(-50%,-50%);pointer-events:auto;touch-action:manipulation;cursor:pointer;filter:drop-shadow(0 9px 11px rgba(184,27,91,.28));animation:pulse 1.45s ease-in-out infinite}
.startBtn{top:90%}
.cta{top:89%}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.035)}}
.pressed{animation:none!important;transform:translate(-50%,-50%) scale(.94)!important;transition:transform .11s}
.startGlow{position:absolute;left:50%;top:90%;width:76%;height:12%;transform:translate(-50%,-50%);border-radius:999px;background:rgba(255,71,132,.32);filter:blur(18px);animation:glow 1.45s ease-in-out infinite;z-index:-1}
@keyframes glow{0%,100%{opacity:.4;transform:translate(-50%,-50%) scale(.94)}50%{opacity:.8;transform:translate(-50%,-50%) scale(1.04)}}

/* ---------- Hearts (background + scene transitions) ---------- */
#hearts,#tHearts{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#hearts{z-index:10}
#tHearts{z-index:85}
.floatHeart,.tHeart{position:absolute;bottom:-8%;font-size:var(--size);animation:heartFloat var(--dur) linear both;will-change:transform,opacity}
.floatHeart{color:rgba(255,80,139,var(--alpha));text-shadow:0 0 8px rgba(255,255,255,.5)}
.tHeart{color:rgba(255,92,150,var(--alpha));text-shadow:0 0 10px rgba(255,255,255,.9),0 0 18px rgba(255,70,130,.7)}
@keyframes heartFloat{
 0%{opacity:0;transform:translate3d(0,0,0) scale(.45)}
 12%{opacity:1}
 55%{transform:translate3d(var(--x1),-52vh,0) scale(1) rotate(14deg)}
 100%{opacity:0;transform:translate3d(var(--x2),-116vh,0) scale(.7) rotate(-15deg)}}

/* ---------- Play screen ---------- */
#play{position:absolute;inset:0;z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
.active{opacity:1!important;pointer-events:auto!important}
.hint{width:40%;left:50%;top:14%;transform:translate(-50%,-50%);transition:opacity .2s,transform .28s;filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.hint.hide{opacity:0;transform:translate(-50%,-50%) scale(.94)}
.hint.enter{animation:hintIn .45s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes hintIn{from{opacity:0;transform:translate(-50%,-50%) translateY(-14px) scale(.92)}to{opacity:1;transform:translate(-50%,-50%)}}
#hint{width:40%}
#hint[src*='hint_3.webp']{width:50%}

/* Target: outer = position, .tPulse = idle pulse, .tBody = hover/press/hit/appear */
.target{position:absolute;width:29%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:45;cursor:pointer;touch-action:manipulation}
.target.hidden{opacity:0}
.target.disabled{pointer-events:none}
.tPulse{position:absolute;inset:0;animation:targetPulse 1.7s ease-in-out infinite}
@keyframes targetPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.tBody{position:absolute;inset:0;z-index:5;transition:transform .14s ease-out,filter .14s ease-out}
.tBody img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.target.appear .tBody{animation:popIn .5s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes popIn{0%{opacity:0;transform:scale(.25) rotate(-8deg)}60%{opacity:1;transform:scale(1.12) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
.target.pressing .tBody{transform:scale(.88);filter:brightness(1.15)}
.target.hit{pointer-events:none}
.target.hit .tBody{animation:squash .42s ease-out forwards}
@keyframes squash{
 0%{transform:scale(1,1)}
 25%{transform:scale(1.32,.7)}
 55%{transform:scale(.8,1.28)}
 100%{transform:scale(.2,.2);opacity:0}}
.glow{position:absolute;inset:-38%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.78),rgba(255,93,158,.46) 36%,rgba(255,60,130,.18) 55%,transparent 72%);filter:blur(8px);animation:targetGlow 1.1s ease-in-out infinite;transform:translate(-2px,12px);transition:filter .15s}
@keyframes targetGlow{0%,100%{opacity:.6;transform:scale(.88) translate(-2px,12px)}50%{opacity:1;transform:scale(1.15) translate(-2px,12px)}}
.ring{position:absolute;left:50%;top:50%;width:88%;height:88%;border:3px solid rgba(255,255,255,.95);box-shadow:0 0 12px rgba(255,90,150,.7);border-radius:50%;transform:translate(-54%,-46%) scale(.58) translateY(12px);opacity:0;animation:ring 2.2s cubic-bezier(.25,.8,.25,1) infinite}
.ring:nth-of-type(2){animation-delay:.7s}
.ring:nth-of-type(3){animation-delay:1.4s}
@keyframes ring{0%{opacity:.6;transform:translate(-54%,-46%) scale(.58) translateY(12px)}35%{opacity:.72}75%{opacity:.12}100%{opacity:0;transform:translate(-54%,-46%) scale(1.72) translateY(12px)}}
.target.hit .ring{animation:none;opacity:0}
.target.hit .glow{animation:glowBurst .42s ease-out forwards}
@keyframes glowBurst{0%{opacity:1;transform:scale(1) translate(-2px,12px)}100%{opacity:0;transform:scale(2.2) translate(-2px,12px)}}
@media (hover:hover){
 .target:not(.disabled):hover .tBody{transform:scale(1.1);filter:brightness(1.12) drop-shadow(0 0 10px rgba(255,255,255,.9))}
 .target:not(.disabled):hover .glow{animation-duration:.55s;filter:blur(9px) brightness(1.3)}
 .target:not(.disabled):hover .ring{animation-duration:.95s}
}

/* ---------- Particles ---------- */
#particles{position:absolute;inset:0;z-index:80;pointer-events:none;overflow:hidden}
.particle{position:absolute;left:0;top:0;transform:translate(-50%,-50%);animation:burst .8s cubic-bezier(.15,.7,.25,1) forwards;will-change:transform,opacity}
.heartParticle{font-size:var(--size);color:#ff4e8b;text-shadow:0 0 10px #fff,0 0 18px rgba(255,78,139,.9)}
.spark{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 18px #ff6aa6}
.star{font-size:var(--size);color:#fff6c9;text-shadow:0 0 8px #ffd54a,0 0 14px #fff}
@keyframes burst{
 0%{opacity:1;transform:translate(-50%,-50%) scale(.35)}
 60%{opacity:1}
 100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(var(--scale)) rotate(var(--rot))}}
.shock{position:absolute;width:70px;height:70px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 18px rgba(255,80,140,.9),inset 0 0 14px rgba(255,255,255,.7);transform:translate(-50%,-50%) scale(.2);animation:shock .5s ease-out forwards}
@keyframes shock{0%{opacity:.95;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.4)}}
.flyHeart{position:absolute;left:0;top:0;font-size:26px;color:#ff4e8b;text-shadow:0 0 10px #fff,0 0 18px rgba(255,78,139,.95);will-change:transform}

/* ---------- Final ---------- */
#final{position:absolute;inset:0;z-index:60;opacity:0;pointer-events:none;transform:scale(1.025);transition:opacity .45s,transform .5s cubic-bezier(.2,.8,.2,1)}
#final.active{opacity:1;pointer-events:auto;transform:scale(1)}
.finalText{width:82%;left:50%;top:66%;transform:translate(-50%,-50%)}
#final .cta{pointer-events:none}
#final.active .cta{pointer-events:auto;animation:pulse 1.45s ease-in-out infinite,fadeIn .5s ease-out .2s backwards}
#final.active .finalText{animation:popUp .6s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes popUp{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- Misc ---------- */
#flash{position:absolute;inset:0;z-index:100;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:flash .3s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:.75}100%{opacity:0}}
#sound{position:absolute;z-index:200;right:3.5%;top:2.5%;width:10.5%;aspect-ratio:1;border:0;border-radius:50%;background:rgba(255,255,255,.82);box-shadow:0 3px 13px rgba(0,0,0,.18);font-size:clamp(15px,4vw,24px);padding:0;cursor:pointer;touch-action:manipulation;transform:scale(1);transition:transform .12s ease,filter .12s ease}
.pressed-sound{transform:scale(.92)!important;filter:brightness(.96)!important}
#loading{position:absolute;inset:0;z-index:500;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .35s}
#loading.hide{opacity:0;pointer-events:none}
.loader{width:36px;height:36px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="game">
<img id="bgA" class="bg on" src="assets/start_scene.webp" data-src="assets/start_scene.webp" alt="">
<img id="bgB" class="bg" alt="">
<div class="vignette"></div><div id="sweep" class="sweep"></div><div id="hearts"></div>

<div id="start" class="ui">
<img class="asset title" src="assets/title.webp" alt="">
<img class="asset startHint" src="assets/hint_start.webp" alt="">
<img class="asset counter" src="assets/counter_0_3.webp" alt="">
<div class="startGlow"></div>
<img id="startBtn" class="asset startBtn" src="assets/start_button.webp" alt="">
</div>

<div id="play">
<img id="hint" class="asset hint" src="assets/hint_1.webp" alt="">
<img id="counter" class="asset counter" src="assets/counter_1_3.webp" alt="">
<div id="target" class="target hidden disabled">
<div class="tPulse">
<div class="glow"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
<div class="tBody"><img id="targetImg" src="assets/target_1.webp" alt=""></div>
</div>
</div>
</div>

<div id="particles"></div>

<div id="final">
<img class="asset finalText" src="assets/final_text.webp" alt="">
<img id="cta" class="asset cta" src="assets/cta_button.webp" alt="">
</div>

<div id="tHearts"></div>
<div id="flash"></div>
<button id="sound">🔊</button>
<audio id="music" src="assets/music.mp3" loop preload="auto"></audio>
<audio id="finalMusic" src="assets/voice_final.mp3" preload="auto"></audio>
<audio id="clickSound" src="assets/voice_click.mp3" preload="auto"></audio>
<audio id="voice1" src="assets/voice_1.mp3" preload="auto"></audio>
<audio id="voice2" src="assets/voice_2.mp3" preload="auto"></audio>
<audio id="voice3" src="assets/voice_3.mp3" preload="auto"></audio>
<div id="loading"><div class="loader"></div></div>
</div>
<script>
const CONFIG={
 CTA_URL:'https://hanimax.com/serials/vacation-with-my-stepmom/teaser',
 targets:{1:{x:33,y:59},2:{x:77,y:57},3:{x:50,y:63}},
 scenes:{
  1:{background:'assets/scene_1.webp',hint:'assets/hint_1.webp',counter:'assets/counter_1_3.webp',target:'assets/target_1.webp'},
  2:{background:'assets/scene_2.webp',hint:'assets/hint_2.webp',counter:'assets/counter_2_3.webp',target:'assets/target_2.webp'},
  3:{background:'assets/scene_3.webp',hint:'assets/hint_3.webp',counter:'assets/counter_3_3.webp',target:'assets/target_3.webp '}
 },
 transition:420,   // hit -> next scene
 reveal:360,       // scene load -> target appears
 voiceDelay:80,
 MAX_PARTICLES:64, // hard cap for burst layer
 MAX_BG_HEARTS:18,
 MAX_T_HEARTS:24
};

const $=id=>document.getElementById(id);
const game=$('game'),bgA=$('bgA'),bgB=$('bgB'),start=$('start'),play=$('play'),final=$('final'),startBtn=$('startBtn'),
 hint=$('hint'),counter=$('counter'),target=$('target'),targetImg=$('targetImg'),particles=$('particles'),
 hearts=$('hearts'),tHearts=$('tHearts'),flash=$('flash'),sweep=$('sweep'),cta=$('cta'),sound=$('sound'),
 music=$('music'),finalMusic=$('finalMusic'),clickSound=$('clickSound'),voices=[$('voice1'),$('voice2'),$('voice3')];

let scene=0,locked=false,soundOn=true,phase='start';

/* ---------- helpers: one place for timers and effect limits ---------- */
const timers=new Set();
function after(fn,ms){const id=setTimeout(()=>{timers.delete(id);fn()},ms);timers.add(id);return id}
function restart(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function trim(layer,max){while(layer.childElementCount>max)layer.firstElementChild.remove()}
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- audio ---------- */
function playSfx(a,vol){
 if(!a)return;
 a._used=true;
 try{a.muted=false;a.volume=vol;a.currentTime=0}catch(e){}
 const p=a.play();if(p&&p.catch)p.catch(()=>{});
}
let audioUnlocked=false;
function unlockAudio(){
 if(audioUnlocked)return;
 audioUnlocked=true;
 [clickSound,finalMusic,...voices].forEach(a=>{
  const done=()=>{if(a._used)return;try{a.pause();a.currentTime=0}catch(e){}a.muted=false};
  try{
   a.muted=true;
   const p=a.play();
   if(p&&p.then)p.then(done).catch(()=>{a.muted=false});else done();
  }catch(e){a.muted=false}
 });
}
function audioStart(){
 if(!soundOn||phase==='final'||!music.paused)return;
 music.volume=.32;
 const p=music.play();if(p&&p.catch)p.catch(()=>{});
}
function voice(n){if(!soundOn)return;playSfx(voices[n-1],1)}
// real user gestures: unlock sfx elements and (re)start music
['pointerup','touchend','click'].forEach(t=>document.addEventListener(t,()=>{unlockAudio();audioStart()},{capture:true,passive:true}));

let lastToggle=0;
function toggleSound(){
 const t=performance.now();if(t-lastToggle<350)return;lastToggle=t;
 sound.classList.add('pressed-sound');after(()=>sound.classList.remove('pressed-sound'),120);
 if(soundOn){
  playSfx(clickSound,.6);
  soundOn=false;sound.textContent='🔇';
  music.pause();finalMusic.pause();voices.forEach(a=>a.pause());
 }else{
  soundOn=true;sound.textContent='🔊';
  playSfx(clickSound,.6);audioStart();
 }
}
sound.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();sound.classList.add('pressed-sound')});
sound.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();toggleSound()});
sound.addEventListener('click',e=>{e.stopPropagation();toggleSound()});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){music.pause();finalMusic.pause()}
 else if(phase==='final'){if(soundOn&&finalMusic.paused&&!finalMusic.ended&&finalMusic.currentTime>0)finalMusic.play().catch(()=>{})}
 else audioStart();
});

/* ---------- background crossfade ---------- */
let bgFront=bgA,bgBack=bgB;
function setBg(src){
 if(bgFront.dataset.src===src)return;
 const back=bgBack,old=bgFront,img=new Image();
 const apply=()=>{
  back.classList.remove('on','front');
  back.src=src;back.dataset.src=src;
  void back.offsetWidth;
  old.classList.remove('front');
  back.classList.add('front');
  requestAnimationFrame(()=>back.classList.add('on'));
  bgFront=back;bgBack=old;
  after(()=>{if(old!==bgFront)old.classList.remove('on')},700);
 };
 img.onload=img.onerror=apply;
 img.src=src;
}

/* ---------- start ---------- */
function press(el){el.classList.add('pressed');after(()=>el.classList.remove('pressed'),130)}
function beginPlayable(e){
 e.preventDefault();e.stopPropagation();
 if(locked||start.classList.contains('out'))return;
 press(startBtn);audioStart();
 locked=true;scene=1;
 clearInterval(heartTimer);
 start.classList.add('out');
 after(()=>{phase='play';play.classList.add('active');loadScene(1)},280);
}
startBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();press(startBtn)});
startBtn.addEventListener('pointerup',beginPlayable);
startBtn.addEventListener('click',e=>{if(!e.detail||e.detail===1)beginPlayable(e)});
startBtn.addEventListener('touchend',e=>{e.preventDefault()});

/* ---------- scenes ---------- */
function loadScene(n){
 const s=CONFIG.scenes[n];if(!s)return;
 locked=true;
 target.classList.remove('hit','appear','pressing');
 target.classList.add('disabled','hidden');
 hint.classList.add('hide');
 setBg(s.background);
 hint.src=s.hint;counter.src=s.counter;targetImg.src=s.target;
 const p=CONFIG.targets[n];target.style.left=p.x+'%';target.style.top=p.y+'%';
 if(n===1)restart(counter,'bump');
 after(()=>{
  target.classList.remove('hidden','disabled');
  restart(target,'appear');
  hint.classList.remove('hide');restart(hint,'enter');
  locked=false;
 },CONFIG.reveal);
}

target.addEventListener('pointerdown',e=>{
 e.preventDefault();
 if(locked||target.classList.contains('disabled'))return;
 target.classList.add('pressing');
 hit();
});
game.addEventListener('pointerdown',e=>{
 if(!play.classList.contains('active')||locked)return;
 if(e.target.closest('#target')||e.target.closest('#sound'))return;
 e.preventDefault();
 hit();
});

function hit(){
 if(locked)return;
 locked=true;
 const n=scene;
 target.classList.remove('pressing');
 target.classList.add('disabled');
 hint.classList.add('hide');
 audioStart();
 if(soundOn) playSfx(clickSound, 0.8);
 after(()=>voice(n),CONFIG.voiceDelay);
 burst();
 flyProgress(n);
 restart(flash,'on');
 restart(sweep,'run');
 target.classList.add('hit');
 after(transitionHearts,120);
 after(()=>{if(n<3){scene=n+1;loadScene(scene)}else showFinal()},CONFIG.transition);
}

/* ---------- effects ---------- */
function fx(cls,text,cx,cy,vars){
 const p=document.createElement('div');
 p.className=cls;if(text)p.textContent=text;
 p.style.left=cx+'px';p.style.top=cy+'px';
 for(const k in vars)p.style.setProperty(k,vars[k]);
 p.addEventListener('animationend',()=>p.remove(),{once:true});
 particles.appendChild(p);
}
function burst(){
 const r=target.getBoundingClientRect(),g=game.getBoundingClientRect(),
  cx=r.left+r.width/2-g.left,cy=r.top+r.height/2-g.top,k=g.width/390;
 fx('shock',null,cx,cy,{});
 for(let i=0;i<16;i++){
  const a=Math.PI*2/16*i+(Math.random()-.5)*.35,d=rnd(80,210)*k;
  fx('particle heartParticle',i%3?'♥':'♡',cx,cy,{
   '--size':rnd(15,33).toFixed(0)+'px','--x':Math.cos(a)*d+'px','--y':Math.sin(a)*d+'px',
   '--rot':rnd(-80,80).toFixed(0)+'deg','--scale':rnd(.7,1.5).toFixed(2)});
 }
 for(let i=0;i<10;i++){
  const a=Math.random()*Math.PI*2,d=rnd(45,160)*k;
  fx('particle spark',null,cx,cy,{'--x':Math.cos(a)*d+'px','--y':Math.sin(a)*d+'px','--rot':'0deg','--scale':rnd(.4,1.2).toFixed(2)});
 }
 for(let i=0;i<4;i++){
  const a=Math.random()*Math.PI*2,d=rnd(60,140)*k;
  fx('particle star','✦',cx,cy,{'--size':rnd(14,24).toFixed(0)+'px','--x':Math.cos(a)*d+'px','--y':Math.sin(a)*d+'px','--rot':rnd(-120,120).toFixed(0)+'deg','--scale':rnd(.8,1.4).toFixed(2)});
 }
 trim(particles,CONFIG.MAX_PARTICLES);
}
// heart flies from the target to the counter, counter "confirms" progress
function flyProgress(n){
 const r=target.getBoundingClientRect(),c=counter.getBoundingClientRect(),g=game.getBoundingClientRect(),
  sx=r.left+r.width/2-g.left,sy=r.top+r.height/2-g.top,ex=c.left+c.width/2-g.left,ey=c.top+c.height/2-g.top;
 let finished=false;
 const done=()=>{
  if(finished)return;finished=true;
  const nx=CONFIG.scenes[n+1];if(nx)counter.src=nx.counter;
  restart(counter,'bump');
 };
 if(!particles.animate){after(done,400);return}
 const h=document.createElement('div');
 h.className='flyHeart';h.textContent='♥';
 particles.appendChild(h);trim(particles,CONFIG.MAX_PARTICLES);
 const a=h.animate([
  {transform:`translate(${sx}px,${sy}px) translate(-50%,-50%) scale(.6)`,opacity:1},
  {transform:`translate(${(sx+ex)/2+30}px,${(sy+ey)/2-40}px) translate(-50%,-50%) scale(1.4)`,opacity:1,offset:.5},
  {transform:`translate(${ex}px,${ey}px) translate(-50%,-50%) scale(.7)`,opacity:.9}
 ],{duration:400,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
 a.onfinish=()=>{h.remove();done()};
 a.oncancel=done;
}

function mkHeart(layer,cls,o){
 const h=document.createElement('div');
 h.className=cls;h.textContent=Math.random()>.45?'♥':'♡';
 h.style.left=o.left+'%';
 h.style.setProperty('--size',o.size.toFixed(0)+'px');
 h.style.setProperty('--alpha',o.alpha.toFixed(2));
 h.style.setProperty('--dur',o.dur.toFixed(2)+'s');
 h.style.setProperty('--x1',o.x1.toFixed(0)+'px');
 h.style.setProperty('--x2',o.x2.toFixed(0)+'px');
 if(o.delay)h.style.animationDelay=o.delay.toFixed(2)+'s';
 h.addEventListener('animationend',()=>h.remove(),{once:true});
 layer.appendChild(h);
 trim(layer,o.max);
}
// hearts that sweep the screen on scene changes
function transitionHearts(){
 for(let i=0;i<12;i++)mkHeart(tHearts,'tHeart',{
  left:rnd(5,95),size:rnd(22,44),alpha:rnd(.75,1),dur:rnd(1,1.7),delay:rnd(0,.25),
  x1:rnd(-50,50),x2:rnd(-80,80),max:CONFIG.MAX_T_HEARTS});
}
function spawnBgHeart(delay){
 mkHeart(hearts,'floatHeart',{
  left:rnd(4,96),size:rnd(12,32),alpha:rnd(.25,.8),dur:rnd(4.5,8),delay:delay,
  x1:rnd(-45,45),x2:rnd(-70,70),max:CONFIG.MAX_BG_HEARTS});
}
for(let i=0;i<8;i++)spawnBgHeart(i*.43);
let heartTimer=setInterval(()=>{if(!document.hidden)spawnBgHeart(0)},800);

/* ---------- final ---------- */
function showFinal(){
 phase='final';
 play.classList.remove('active');
 music.pause();try{music.currentTime=0}catch(e){}
 if(soundOn)playSfx(finalMusic,.8);
 setBg('assets/final_scene.webp');
 transitionHearts();
 after(()=>{final.classList.add('active');locked=false},220);
}
function openCtaUrl(){
 if(!CONFIG.CTA_URL)return;
 const url=String(CONFIG.CTA_URL).trim();
 if(!url)return;
 window.location.href=url;
}
cta.addEventListener('pointerdown',e=>{e.preventDefault();press(cta)});
cta.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();openCtaUrl()});
cta.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openCtaUrl()});

/* ---------- preload ---------- */
const imgs=['start_scene.webp','scene_1.webp','scene_2.webp','scene_3.webp','final_scene.webp','title.webp','hint_start.webp','hint_1.webp','hint_2.webp','hint_3.webp','counter_0_3.webp','counter_1_3.webp','counter_2_3.webp','counter_3_3.webp','start_button.webp','target_1.webp','target_2.webp','target_3.webp','final_text.webp','cta_button.webp'];
let loaded=0;
imgs.forEach(x=>{const i=new Image();i.onload=i.onerror=()=>{if(++loaded>=imgs.length)after(()=>$('loading').classList.add('hide'),180)};i.src='assets/'+x});

game.addEventListener('contextmenu',e=>e.preventDefault());
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
window.addEventListener('pagehide',()=>{clearInterval(heartTimer);timers.forEach(clearTimeout);timers.clear()});
</script>
